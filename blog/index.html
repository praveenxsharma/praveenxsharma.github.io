  <a class="skip-link" href="#main">Skip to main content</a>

  <main id="main" class="shell">
    <h1 class="blog-index-title">blog</h1>
    <p class="blog-index-sub">writeups, notes, and whatever i&#39;m breaking this week.</p>

    <div class="blog-cards-full">

      <!-- ================================================================
           HOW TO ADD A NEW POST:

           1. Create a new folder:  blog/your-post-slug/
           2. Copy blog/_template/index.html into it and fill it in
           3. Add a new <a class="blog-card"> entry HERE at the TOP of the list

           Fields to update in the card:
             href       → blog/your-post-slug/
             card-title → post title
             date       → YYYY-MM-DD
             tags line  → tag names separated by /
             card-desc  → one sentence summary
             card-footer → "X words | Y minutes"
           ================================================================ -->

      <a href="hello-world/" class="blog-card">
        <div class="card-body">
          <h2 class="card-title">Hello World</h2>
          <div class="card-meta">
            <span>
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              2026-02-26
            </span>
            <span>
              <svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
              misc
            </span>
          </div>
          <p class="card-desc">First post. Setting up the blog and figuring out what to write about.</p>
          <div class="card-footer">~200 words &nbsp;|&nbsp; 1 minute</div>
        </div>
        <div class="card-arrow">&#8250;</div>
      </a>

    </div>
  </main>

  <footer class="shell footer">
